schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  INComedor: puesto autónomo de autoservicio de comedor; proyecto final del máster AI4Devs (LIDR).
  Primer corte (D-C24): un puesto, identificación simulada por código (y, en modo simulación y sólo en mantenimiento,
  eligiendo a la persona en un combo, por simular-identificacion-por-lista), selección, cupo y fecha de negocio,
  confirmación atómica (RB06) con replay por IntentId, comprobante con reimpresión, outbox y receptor idempotente.
  Entran recortados: las bitácoras mensuales (escribir-bitacoras-externas) y la administración local de personas,
  cupos, opciones y franjas mientras no haya INWeb (administrar-personas-y-opciones).
  Entran también, por configurar-puesto-por-pestanas, los modos de mantenimiento y operativo con la clave del día
  de desarrollo; siguen fuera la cuenta individual de mantenimiento y la clave del día real de INWeb.
  Por entrar-a-configuracion-con-teclado, la clave se pide en los dos modos y un operador con OPERATOR entra a
  Consumos, Personas e Impresora.
  Fuera del corte, diseñado y no demostrado: multipuesto, diagnóstico, los demás permisos de operador, importación de INWeb,
  cuenta de mantenimiento, biometría 1:N y 1:1 y auditoría de saltos del reloj.
  Stack: C# y .NET 11; pantallas Razor en Blazor Hybrid con host WPF; Microsoft.Data.Sqlite; receptor ASP.NET Core; xUnit.
  El puesto autoriza y registra sin red; ningún acuse central autoriza ni revierte un consumo.
  Sólo datos sintéticos y cliente anonimizado: ningún dato personal real ni template biométrico.
  docs/especificacion-sdd.md es la visión del producto completo: antecedente, no requisito del corte.

rules:
  proposal:
    - Nombrar la historia (HU) y el ticket (TK) que originan el change, y sus non-goals.
  specs:
    - Cada requirement lleva al menos un escenario de error o de borde además del camino feliz.
    - Usar el vocabulario de docs/especificacion-sdd.md (IntentId, RB06, cupo, fecha de negocio) y citar el AT de origen de cada escenario.
  design:
    - Cada decisión nombra la alternativa descartada y el porqué.
    - "Prolijidad visual: los controles hermanos de una misma tarjeta o fila comparten ancho o bordes alineados, tipografía y relleno, además del alto táctil. Toda decisión que toque una pantalla dice cómo quedan alineados sus controles hermanos."
    - "Puntuación de la interfaz (pedido de David del 10/11/2026): toda oración que la pantalla muestra (un aviso, un mensaje, una explicación) termina en punto; un título, un rótulo, un botón, una opción o un estado de una o pocas palabras no. Una spec que cita un mensaje entre comillas latinas deja el punto final fuera de las comillas, como pide la RAE."
  tasks:
    - Cada tarea nombra la prueba o el comando que la verifica.
    - Las pruebas de un grupo van dentro del grupo, no al final.
    - Ninguna tarea modifica un test existente sin aprobación de David.
    - "Puntuación de la interfaz: toda tarea que agregue o cambie un texto de la pantalla lo deja con el punto final si es una oración, y su prueba lo compara con el mensaje entero."
    - "Prolijidad visual: toda tarea que toque una pantalla mide por CDP, a 1024 × 768, los bordes izquierdo y derecho, el alto y el tamaño de letra de sus controles hermanos (tolerancia de 1 px), pega las medidas y deja una captura que la verificación mira."
    - "La última tarea del change agrega su evidencia: la fila nueva o actualizada en `docs/aplicacion-del-curso.md` y, si deja un workflow o un ajuste humano nuevo, su entrada en `prompts.md`; se verifica con el chequeo de enlaces relativos."
