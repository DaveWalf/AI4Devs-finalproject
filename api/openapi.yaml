openapi: 3.1.0
info:
  title: INComedor - configuración y consolidación eventual
  version: 0.6.0-draft
  description: |
    Contrato propuesto para tres operaciones entre el puesto INComedor e INWeb:
    descargar la configuración completa y enviar o consultar lotes de hechos ya
    decididos localmente. No acredita una API implementada.

    La versión 0.6.0-draft endurece la semántica de credenciales y permisos:
    códigos no reasignables y revocación conocida al activar el snapshot.
    Mantiene la estructura JSON y SchemaVersion 3 del snapshot; la versión
    del documento no negocia capacidades en ejecución. No agrega endpoints.

    El puesto autoriza e imprime con su base SQLite; ningún ACK central autoriza
    un consumo ni lo rechaza retroactivamente. El certificado de equipo (mTLS)
    protege sólo este intercambio: su vencimiento o la falta de red no bloquean
    la operación local de un puesto único. La política multipuesto
    CONTINUE_LOCAL o SUSPEND_NEW_CONSUMPTIONS viaja en la configuración.

    El snapshot incluye padrón operativo, credenciales por código, permisos
    locales, catálogo y reglas. Los templates biométricos, el feed de consumos
    entre puestos y la administración local usan contratos complementarios
    fuera de estas operaciones. Todos los ejemplos son sintéticos.

    Los objetos del dominio usan PascalCase; ProblemDetails conserva los nombres
    de RFC 9457. Las decisiones que originan el contrato están en docs/decisiones.md.
servers:
  - url: https://api.incomedor.example
    description: Dominio reservado de ejemplo, sin servicio desplegado.
security:
  - KioskCertificate: []
tags:
  - name: Configuración
  - name: Consolidación
paths:
  /api/incomedor/v1/configuration:
    get:
      operationId: GetConfiguration
      tags: [Configuración]
      summary: Descargar un snapshot completo para activación local atómica.
      description: |
        KioskId, SiteId y organización se obtienen del registro autenticado.
        El snapshot integra padrón operativo mínimo, reglas y catálogo compatibles
        entre sí. El cliente valida esquema, ámbito, hash y referencias en staging
        y recién entonces lo activa completo; una descarga incompleta conserva
        el snapshot anterior y no interrumpe la operación con la base existente.

        Los snapshots muestran dos configuraciones alternativas del mismo puesto.
        SyncBatch corresponde a ConfigurationVersion 1; el segundo ejemplo muestra
        la política de suspensión, sin afirmar que el puesto ya la haya activado.

        PayloadHash se propone como SHA-256 hexadecimal de Payload serializado
        canónicamente según RFC 8785 (esquema 1). No incluye su propio hash.
        Las bajas del padrón, las revocaciones de credenciales y permisos y los
        cambios de derechos se aplican al activar la nueva versión; mientras no
        llegue, rigen las últimas reglas locales. Esto implica una demora de
        revocación conocida. El feed complementario de consumos pares reduce la
        ventana de sobrecupo multipuesto, sin prometer exclusión global.

        Con If-None-Match igual al ETag del snapshot vigente, la respuesta es 304
        sin cuerpo. Si todavía no existe una publicación para el equipo, la
        respuesta es 404 y el puesto conserva lo que tenga activo.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: ETag del último snapshot recibido por el puesto.
          schema:
            type: string
      responses:
        '200':
          description: Snapshot completo; configuración local utilizable después de validación y commit.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationSnapshot'
              examples:
                continue_local:
                  summary: 'Fixture sintético completo: tres personas con cinco códigos y tres permisos, quince menús y cupos compartidos; continuidad local.'
