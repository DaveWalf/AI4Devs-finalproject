  /api/incomedor/v1/sync-batches:
    post:
      operationId: SubmitSyncBatch
      tags: [Consolidación]
      summary: Enviar hechos locales durables para consolidación idempotente.
      description: |
        ConsumptionId y EventId nacen en la transacción SQLite local que guarda
        intención, decisión, consumo, ObservedConsumption propio con sus
        ObservedQuotaCharge, contador, ticket, primer PrintJob, outbox y AuditRecord
        en una misma transacción antes de imprimir (RB06). La impresión
        genera después sus propios eventos. El envío no participa en la autorización.

        El cliente guarda BatchId y el lote antes de enviar. Idempotency-Key debe
        ser idéntico a BatchId. Se calcula SHA-256 del body JSON canónico (RFC 8785,
        esquema 1); la misma clave con otro body produce 409, sin alterar el original.
        EventId se deduplica además entre lotes: un hecho ya proyectado con el
        mismo contenido es DUPLICATE; una recepción aún en revisión conserva ese estado;
        otro contenido para EventId es CONFLICT y requiere revisión visible.
        ConsumptionId conserva su unicidad de negocio durante la consolidación.
        AppliedQuotaCharges conserva ámbito, categoría, unidades y fecha de cada
        carga aplicada. El servidor usa estos hechos para distribuir a los pares
        y detectar sobrecupos, sin recalcular silenciosamente la decisión local.

        Un ACK por evento informa recepción, conflicto técnico o revisión de un
        hecho ya decidido localmente; no cambia AUTHORIZED a DENIED ni elimina
        la comida servida. REJECTED significa payload no incorporado, nunca rechazo
        retroactivo del derecho a comer. El kiosco conserva conflictos y rechazos
        para diagnóstico y conciliación, sin purgar silenciosamente su outbox.
        Inbox durable y proyección son estados distintos. Un evento recibido
        antes de su referencia conserva NEEDS_REVIEW/RELATED_EVENT_PENDING,
        incluso al repetirse; no se transforma en DUPLICATE sólo por existir en
        Inbox. El servidor retoma su proyección al llegar la referencia y registra
        la resolución, sin depender de un reenvío ciego del cliente. El ACK de cada
        lote permanece como recibo original; el seguimiento de revisión se resuelve
        en el contrato complementario de auditoría, fuera de estas tres operaciones.

        Ante timeout, consultar el mismo BatchId; si aún no aparece, reenviar
        exactamente el lote original. La autorización local sigue funcionando.
        El protocolo de consolidación es propuesto; no hay servidor implementado.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID idéntico a BatchId, estable durante todos los reintentos.
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatchRequest'
            examples:
              syntheticConsumption:
                $ref: '#/components/examples/SyncBatch'
              denied_credential_revoked:
                $ref: '#/components/examples/DeniedCredentialRevokedBatch'
              denied_credential_expired:
                $ref: '#/components/examples/DeniedCredentialExpiredBatch'
              denied_rule_denied:
                $ref: '#/components/examples/DeniedRuleDeniedBatch'
      responses:
        '201':
          description: Lote nuevo con resultados de ingesta persistidos para todos sus eventos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletedBatchAck'
              examples:
                completed:
                  $ref: '#/components/examples/CompletedAck'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '200':
          description: ACK durable de un lote ya procesado; no duplica hechos ni altera resultados originales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletedBatchAck'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '202':
          $ref: '#/components/responses/Pending'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/Throttled'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/incomedor/v1/sync-batches/{batchId}:
    get:
      operationId: GetSyncBatch
      tags: [Consolidación]
      summary: Recuperar el ACK por evento después de una respuesta perdida.
      description: |
        Consulta limitada al equipo autenticado. Un lote ajeno se presenta como
        desconocido. PENDING describe sólo procesamiento central de consolidación;
        el consumo local y la impresión no esperan ese estado ni su finalización.
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Resultados durables por evento; se conserva el contenido del ACK original.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletedBatchAck'
              examples:
                completed:
                  $ref: '#/components/examples/CompletedAck'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '202':
          $ref: '#/components/responses/Pending'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    KioskCertificate:
      type: mutualTLS
      description: |
        Credencial de equipo propuesta para configuración y sincronización.
        Emisión, renovación y revocación se especificarán antes de implementación.
        El fallo del handshake no produce respuesta HTTP; 401/403 aplican cuando
        la solicitud alcanza la API. Su falla no invalida la operación local.
  headers:
    CorrelationId:
      description: UUID de diagnóstico sin PII, igual a CorrelationId del cuerpo (correlationId en ProblemDetails).
      schema:
        $ref: '#/components/schemas/Uuid'
    ETag:
      description: Identificador entre comillas del snapshot, formado por su PayloadHash.
      schema:
        type: string
        pattern: '^"[a-f0-9]{64}"$'
    RetryAfter:
      description: Segundos mínimos sugeridos para reintentar la comunicación, conservando el mismo lote.
      schema:
        type: integer
        minimum: 1
        maximum: 9007199254740991
      example: 2
  schemas:
    Uuid:
      type: string
      format: uuid
    UtcTimestamp:
      type: string
      format: date-time
      pattern: 'Z$'
    Hash:
      type: string
      pattern: '^[a-f0-9]{64}$'
    ConfigurationSnapshot:
      type: object
      additionalProperties: false
      required: [SnapshotId, ConfigurationVersion, SchemaVersion, PublishedAtUtc, PayloadHash, Payload, CorrelationId]
      properties:
        SnapshotId:
          $ref: '#/components/schemas/Uuid'
        ConfigurationVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        SchemaVersion:
          type: integer
          const: 3
        PublishedAtUtc:
          $ref: '#/components/schemas/UtcTimestamp'
        PayloadHash:
          $ref: '#/components/schemas/Hash'
        Payload:
          $ref: '#/components/schemas/ConfigurationPayload'
        CorrelationId:
          $ref: '#/components/schemas/Uuid'
    ConfigurationPayload:
      type: object
      additionalProperties: false
      required: [KioskId, SiteId, OperationMode, MultiKioskOfflinePolicy, TimeZoneId, BusinessDayStartLocal, CatalogVersion, PolicyVersion, PeopleVersion, People, Credentials, OperatorGrants, Groups, ServiceTypes, QuotaScopes, QuotaBuckets, MenuItems, Rules]
      properties:
        KioskId:
          $ref: '#/components/schemas/Uuid'
        SiteId:
          $ref: '#/components/schemas/Uuid'
        OperationMode:
          type: string
          enum: [SINGLE_KIOSK, MULTI_KIOSK_AUDITED]
          description: Perfil de la instalación; sólo MULTI_KIOSK_AUDITED aplica suspensión por comunicación.
        MultiKioskOfflinePolicy:
          $ref: '#/components/schemas/MultiKioskOfflinePolicy'
        TimeZoneId:
          type: string
          minLength: 1
          description: Zona acordada para el cómputo local de BusinessDate.
        BusinessDayStartLocal:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Corte diario configurado; su valor de negocio debe aprobarse.
        CatalogVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        PolicyVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        PeopleVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        People:
          type: array
          items:
            $ref: '#/components/schemas/PersonOperationalReference'
        Credentials:
          type: array
          items:
            $ref: '#/components/schemas/PersonCredential'
        OperatorGrants:
          type: array
          items:
            $ref: '#/components/schemas/LocalOperatorGrant'
        Groups:
          type: array
          items:
            $ref: '#/components/schemas/NamedReference'
        ServiceTypes:
          type: array
          items:
            $ref: '#/components/schemas/NamedReference'
        QuotaBuckets:
          type: array
          items:
            $ref: '#/components/schemas/NamedReference'
        QuotaScopes:
          type: array
          items:
            $ref: '#/components/schemas/NamedReference'
        MenuItems:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
        Rules:
          type: array
          items:
            $ref: '#/components/schemas/EntitlementRule'
      description: |
        Versión completa para el ámbito del equipo. Referencias cruzadas, UUID
        únicos, prioridad de reglas y completitud se validan antes de activar.
        No contiene templates, documentos, imágenes ni costo del concesionario.
        Credentials y OperatorGrants se activan con el mismo snapshot que People,
        de modo que persona, credencial y permiso nunca quedan en versiones distintas.
        SchemaVersion 3 exige modo y política explícitos, credenciales y permisos;
        rechazar un snapshot de otro esquema conserva la última versión activa, sin
        cambiarla a CONTINUE_LOCAL.
    MultiKioskOfflinePolicy:
      type: string
      enum: [CONTINUE_LOCAL, SUSPEND_NEW_CONSUMPTIONS]
      default: CONTINUE_LOCAL
      description: |
        Decisión D-A02 por instalación (SiteId). El publicador debe emitir el valor
        explícito requerido por ConfigurationPayload; default documenta el valor
        inicial, no completa payloads inválidos. Persiste con el snapshot íntegro.
        CONTINUE_LOCAL atiende con datos/cupos conocidos y registra incidencia.
        SUSPEND_NEW_CONSUMPTIONS deniega sólo confirmaciones nuevas mientras falla
        envío a INWeb o recepción del feed; conserva hechos, replay y comprobantes.
        Un reinicio no reemplaza una política previa por el valor inicial.
    NamedReference:
      type: object
      additionalProperties: false
      required: [Id, Label]
      properties:
        Id:
          $ref: '#/components/schemas/Uuid'
        Label:
          type: string
          minLength: 1
    PersonOperationalReference:
      type: object
      additionalProperties: false
      required: [PersonId, DisplayName, Active, GroupIds, IdentityMaterialVersion]
      properties:
        PersonId:
          $ref: '#/components/schemas/Uuid'
        DisplayName:
          type: string
          minLength: 1
        Active:
          type: boolean
        GroupIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        IdentityMaterialVersion:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Metadato del conjunto separado de identificación; no contiene credencial ni template.
    PersonCredential:
      type: object
      additionalProperties: false
      required: [CredentialId, PersonId, Kind, NormalizedValue]
      properties:
        CredentialId:
          $ref: '#/components/schemas/Uuid'
        PersonId:
          $ref: '#/components/schemas/Uuid'
        Kind:
          type: string
          enum: [SERIAL_CODE]
          description: Código recibido por el puerto serie. Otro tipo se agrega versionando el esquema.
        NormalizedValue:
          type: string
          pattern: '^[0-9A-Z]{1,32}$'
          description: Valor sin espacios y en mayúsculas que conserva ceros iniciales. Es un identificador, no un secreto.
        ValidFromUtc:
          $ref: '#/components/schemas/UtcTimestamp'
          description: Inicio inclusive; antes de ese instante el código no identifica (IDENTITY_NOT_RESOLVED).
        ValidToUtc:
          $ref: '#/components/schemas/UtcTimestamp'
          description: Fin exclusivo; desde ese instante corresponde CREDENTIAL_EXPIRED.
        RevokedAtUtc:
          $ref: '#/components/schemas/UtcTimestamp'
          description: Revocación ya conocida, no posterior a PublishedAtUtc del snapshot. Su presencia causa CREDENTIAL_REVOKED al activar el snapshot, incluso si retrocede el reloj local.
      description: |
        Credencial por código de una persona del mismo snapshot (RB25). El par
        Kind y NormalizedValue es único en todo el snapshot, incluidas revocadas.
        Un código no se reasigna a otra persona, incluso tras retirar su fila;
        CredentialId mantiene persona, tipo y valor entre versiones. Publicación
        y staging comprueban referencias, unicidad, titularidad histórica y
        RevokedAtUtc <= PublishedAtUtc (AT55). Son validaciones semánticas fuera
        de JSON Schema. El ámbito y provisión del historial se cierran en M0;
        un snapshot aislado no acredita ausencia de asignaciones anteriores.
        El valor no se escribe en logs, tickets ni eventos. La renovación para
        el mismo titular no permite duplicar el código en un snapshot.
    LocalOperatorGrant:
      type: object
      additionalProperties: false
      required: [GrantId, PersonId, Role]
      properties:
        GrantId:
          $ref: '#/components/schemas/Uuid'
        PersonId:
          $ref: '#/components/schemas/Uuid'
        Role:
          type: string
          enum: [OPERATOR, SYSTEM_ADMINISTRATOR]
        ValidFromUtc:
          $ref: '#/components/schemas/UtcTimestamp'
          description: Inicio inclusive del permiso.
        ValidToUtc:
          $ref: '#/components/schemas/UtcTimestamp'
          description: Fin exclusivo del permiso.
        RevokedAtUtc:
          $ref: '#/components/schemas/UtcTimestamp'
          description: Revocación ya conocida, no posterior a PublishedAtUtc; el rol deja de autorizar al activar el snapshot, sin esperar al reloj local.
      description: |
        Permiso local de un rol para una persona del snapshot (RB26). OPERATOR
        recupera y reimprime comprobantes; SYSTEM_ADMINISTRATOR configura y
        diagnostica y exporta bitácoras. Los roles no se heredan. El actor se
        autentica sin red con código y verificación 1:1 o cuenta individual local
        de mantenimiento; el caso de uso comprueba el permiso en cada acción.
        La contraseña no integra este contrato ni habilita consumo.
        Persona y rol son únicos por snapshot. Staging rechaza RevokedAtUtc
        posterior a PublishedAtUtc, también para permisos (AT55).
    MenuItem:
      type: object
      additionalProperties: false
      required: [MenuItemId, Version, ServiceTypeId, Label, Price, QuotaCharges]
      properties:
        MenuItemId:
          $ref: '#/components/schemas/Uuid'
        Version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        ServiceTypeId:
          $ref: '#/components/schemas/Uuid'
        Label:
          type: string
          minLength: 1
        Price:
          $ref: '#/components/schemas/PriceSnapshot'
        QuotaCharges:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [QuotaBucketId, Units]
            properties:
              QuotaBucketId:
                $ref: '#/components/schemas/Uuid'
              Units:
                type: integer
                minimum: 1
                maximum: 9007199254740991
    EntitlementRule:
      type: object
      additionalProperties: false
      required: [RuleId, Subject, ServiceTypeId, QuotaScopeId, QuotaBucketId, Limit, Priority]
      description: |
        Primero se comprueba vigencia y coincidencia del sujeto. Una regla
        aplicable con Limit=0 expresa denegación explícita y prevalece sobre
        cualquier permiso del mismo servicio/ámbito/categoría. Sólo entre reglas
        con Limit>0 se elige la mayor Priority; empates incompatibles impiden
        publicar. Esta precedencia es propuesta técnica para materializar el
        bloqueo conocido. La comparación de fechas se valida por aplicación.
      properties:
        RuleId:
          $ref: '#/components/schemas/Uuid'
        Subject:
          oneOf:
            - type: object
              additionalProperties: false
              required: [PersonId]
              properties:
                PersonId:
                  $ref: '#/components/schemas/Uuid'
            - type: object
              additionalProperties: false
              required: [GroupId]
              properties:
                GroupId:
                  $ref: '#/components/schemas/Uuid'
        ServiceTypeId:
          $ref: '#/components/schemas/Uuid'
        QuotaScopeId:
          $ref: '#/components/schemas/Uuid'
        QuotaBucketId:
          $ref: '#/components/schemas/Uuid'
        Limit:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Cupo configurado; se controla con hechos propios y pares recibidos por la terminal, sin garantía global excluyente.
        Priority:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Mayor valor prevalece sólo entre permisos positivos; una denegación aplicable tiene precedencia.
        ValidFromUtc:
          $ref: '#/components/schemas/UtcTimestamp'
          description: Inicio inclusive; ausente significa sin límite inferior temporal de esta regla.
        ValidToUtc:
          $ref: '#/components/schemas/UtcTimestamp'
          description: Fin exclusivo; ausente significa sin límite superior. Si ambos existen, fin posterior al inicio.
    PriceSnapshot:
      type: object
      additionalProperties: false
      required: [Currency, Scale, EmployeeChargeMinor]
      properties:
        Currency:
          type: string
          pattern: '^[A-Z]{3}$'
        Scale:
          type: integer
          minimum: 0
          maximum: 6
        EmployeeChargeMinor:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
      description: |
        Importe exacto = unidades menores / 10^Scale. Cero es gratuidad explícita;
        ausencia no significa cero. Escala y redondeo comerciales por aprobar.
        VendorCostMinor permanece central, fuera del contrato del kiosco.
        Los enteros JSON se limitan a 2^53-1 para conservar exactitud entre
        productores/consumidores y compatibilidad con canonicalización I-JSON.
    SyncBatchRequest:
      type: object
      additionalProperties: false
      required: [BatchId, SchemaVersion, CreatedAtUtc, Events]
      properties:
        BatchId:
          $ref: '#/components/schemas/Uuid'
        SchemaVersion:
          type: integer
          const: 1
        CreatedAtUtc:
          $ref: '#/components/schemas/UtcTimestamp'
        Events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SyncEvent'
          description: EventId únicos dentro del lote; orden no determina autorización ni precedencia del negocio.
    SyncEvent:
      oneOf:
        - $ref: '#/components/schemas/ConsumptionRecorded'
        - $ref: '#/components/schemas/ConsumptionDenied'
        - $ref: '#/components/schemas/PrintEventRecorded'
        - $ref: '#/components/schemas/ConnectivityIncidentRecorded'
      discriminator:
        propertyName: EventType
        mapping:
          CONSUMPTION_RECORDED: '#/components/schemas/ConsumptionRecorded'
          CONSUMPTION_DENIED: '#/components/schemas/ConsumptionDenied'
          PRINT_EVENT_RECORDED: '#/components/schemas/PrintEventRecorded'
          CONNECTIVITY_INCIDENT_RECORDED: '#/components/schemas/ConnectivityIncidentRecorded'
    ConsumptionRecorded:
      type: object
      additionalProperties: false
      required: [EventId, EventType, PayloadVersion, IntentId, DecisionId, ConsumptionId, TicketId, PersonId, MenuItemId, MenuVersion, Quantity, BusinessDate, AppliedQuotaCharges, LocalCommittedAtUtc, ClientSequence, ConfigurationVersion, CatalogVersion, PolicyVersion, PriceSnapshot]
      properties:
        EventId:
          $ref: '#/components/schemas/Uuid'
        EventType:
          type: string
          const: CONSUMPTION_RECORDED
        PayloadVersion:
          type: integer
          const: 1
        IntentId:
          $ref: '#/components/schemas/Uuid'
        DecisionId:
          $ref: '#/components/schemas/Uuid'
        ConsumptionId:
          $ref: '#/components/schemas/Uuid'
        TicketId:
          $ref: '#/components/schemas/Uuid'
        PersonId:
          $ref: '#/components/schemas/Uuid'
        MenuItemId:
          $ref: '#/components/schemas/Uuid'
        MenuVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        Quantity:
          type: integer
          const: 1
          description: Una unidad por elección como propuesta inicial; no establece el cupo comercial.
        BusinessDate:
          type: string
          format: date
        AppliedQuotaCharges:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AppliedQuotaCharge'
          description: Cargas efectivas para distribuir/auditar; no se infieren sólo del MenuItemId.
        LocalCommittedAtUtc:
          $ref: '#/components/schemas/UtcTimestamp'
        ClientSequence:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        ConfigurationVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        CatalogVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        PolicyVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        PriceSnapshot:
          $ref: '#/components/schemas/PriceSnapshot'
        ConnectivityIncidentId:
          $ref: '#/components/schemas/Uuid'
      description: |
        Hecho autorizado y confirmado localmente; no es una solicitud de autorización
        central. ConnectivityIncidentId referencia la incidencia cuando la confirmación
        ocurrió durante continuidad degradada; si falta su apertura en el receptor,
        conservar el hecho para revisión recuperable, sin negar retroactivamente consumo.
        Todas sus AppliedQuotaCharges conservan exactamente su BusinessDate;
        el receptor valida esa igualdad por aplicación (AT50).
        LocalCommittedAtUtc y BusinessDate conservan el reloj de Windows observado
        y la zona/corte configurados. Los saltos detectados se auditan localmente
        con correlación al consumo. Se acepta el riesgo de fecha/cupo incorrectos,
        sin piso temporal ni suspensión por reloj. D-A02 gobierna la comunicación.
    AppliedQuotaCharge:
      type: object
      additionalProperties: false
      required: [QuotaScopeId, QuotaBucketId, Units, BusinessDate]
      properties:
        QuotaScopeId:
          $ref: '#/components/schemas/Uuid'
        QuotaBucketId:
          $ref: '#/components/schemas/Uuid'
        Units:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        BusinessDate:
          type: string
          format: date
      description: |
        Una carga por ámbito/categoría/fecha. BusinessDate debe ser igual al
        BusinessDate del ConsumptionRecorded que la contiene. La aplicación
        receptora valida esa igualdad antes de proyectar; este JSON Schema no
        comprueba la igualdad entre campos. Una diferencia produce EventAck
        REJECTED/INVALID_EVENT y conserva evidencia para corrección, sin anular
        el consumo local ni alterar su fecha (AT50).
    ConsumptionDenied:
      type: object
      additionalProperties: false
      required: [EventId, EventType, PayloadVersion, IntentId, DecisionId, ReasonCode, LocalCommittedAtUtc, ConfigurationVersion]
      properties:
        EventId:
          $ref: '#/components/schemas/Uuid'
        EventType:
          type: string
          const: CONSUMPTION_DENIED
        PayloadVersion:
          type: integer
          const: 1
        IntentId:
          $ref: '#/components/schemas/Uuid'
        DecisionId:
          $ref: '#/components/schemas/Uuid'
        ReasonCode:
          type: string
          enum: [LOCAL_LIMIT_REACHED, PERSON_INACTIVE, CREDENTIAL_REVOKED, CREDENTIAL_EXPIRED, RULE_DENIED, SERVICE_NOT_ENABLED, IDENTITY_NOT_RESOLVED, CATALOG_UNAVAILABLE, MULTI_KIOSK_COMMUNICATION_REQUIRED]
        LocalCommittedAtUtc:
          $ref: '#/components/schemas/UtcTimestamp'
        ConfigurationVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      description: |
        Decisión local denegada; sin ConsumptionId ni TicketId. No contiene credencial.
        CREDENTIAL_REVOKED y CREDENTIAL_EXPIRED distinguen revocación y vencimiento
        conocidos de PersonCredential (RB25); un código desconocido o todavía no
        vigente usa IDENTITY_NOT_RESOLVED y la intención no tiene sesión.
        PERSON_INACTIVE conserva el motivo de baja de persona.
        RULE_DENIED corresponde a una regla aplicable vigente Limit=0 (RB02);
        SERVICE_NOT_ENABLED indica ausencia de regla aplicable habilitante.
        El contrato conserva PayloadVersion 1 para eventos y usa SchemaVersion 3
        para configuración; los motivos distinguen estados del dominio local.
        Un cambio de catálogo solicita reconfirmación (RB10/HU01-D); no se lo
        convierte por esta revisión en una denegación durable de consumo.
        MULTI_KIOSK_COMMUNICATION_REQUIRED es suspensión técnica configurada, distinta
        de un rechazo por cupo. El replay conserva esa decisión; tras recuperarse,
        una confirmación nueva utiliza otra intención y valida reglas actuales.
    PrintEventRecorded:
      type: object
      additionalProperties: false
      required: [EventId, EventType, PayloadVersion, TicketId, ConsumptionId, CopyNumber, PrintState, OccurredAtUtc]
      properties:
        EventId:
          $ref: '#/components/schemas/Uuid'
        EventType:
          type: string
          const: PRINT_EVENT_RECORDED
        PayloadVersion:
          type: integer
          const: 1
        TicketId:
          $ref: '#/components/schemas/Uuid'
        ConsumptionId:
          $ref: '#/components/schemas/Uuid'
        CopyNumber:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        PrintState:
          type: string
          enum: [QUEUED, SUBMITTED, FAILED, UNKNOWN]
        OccurredAtUtc:
          $ref: '#/components/schemas/UtcTimestamp'
      description: SUBMITTED indica entrega al spooler, no prueba de papel. Un fallo no anula el consumo.
    ConnectivityIncidentRecorded:
      type: object
      additionalProperties: false
      required: [EventId, EventType, PayloadVersion, IncidentId, Phase, OccurredAtUtc, ConfigurationVersion, MultiKioskOfflinePolicy, FailureKind]
      properties:
        EventId:
          $ref: '#/components/schemas/Uuid'
        EventType:
          type: string
          const: CONNECTIVITY_INCIDENT_RECORDED
        PayloadVersion:
          type: integer
          const: 1
        IncidentId:
          $ref: '#/components/schemas/Uuid'
        Phase:
          type: string
          enum: [OPENED, RECOVERED]
        OccurredAtUtc:
          $ref: '#/components/schemas/UtcTimestamp'
        ConfigurationVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        MultiKioskOfflinePolicy:
          $ref: '#/components/schemas/MultiKioskOfflinePolicy'
        FailureKind:
          type: string
          enum: [OUTBOUND, PEER_FEED, BOTH]
      description: |
        Transición durable de una incidencia del equipo autenticado. OPENED y RECOVERED
        tienen EventId diferentes y el mismo IncidentId; cada retry conserva su EventId.
        Configuración, política y FailureKind describen la apertura, conservados en cierre.
        RECOVERED acredita los puntos de corte de recepción/feed recuperados, no un ping.
        Cierre anterior a apertura usa NEEDS_REVIEW/RELATED_EVENT_PENDING; el receptor
        retoma proyección al llegar la referencia. No suma cupo ni genera impresión.
    PendingBatchAck:
      type: object
      additionalProperties: false
      required: [BatchId, Status, CorrelationId]
      properties:
        BatchId:
          $ref: '#/components/schemas/Uuid'
        Status:
          type: string
          const: PENDING
        CorrelationId:
          $ref: '#/components/schemas/Uuid'
    CompletedBatchAck:
      type: object
      additionalProperties: false
      required: [BatchId, Status, ServerAcknowledgedAtUtc, Results, CorrelationId]
      properties:
        BatchId:
          $ref: '#/components/schemas/Uuid'
        Status:
          type: string
          const: COMPLETED
        ServerAcknowledgedAtUtc:
          $ref: '#/components/schemas/UtcTimestamp'
        Results:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EventAck'
          description: Exactamente un resultado por EventId recibido; sin extraños ni omitidos. Validación de aplicación.
        CorrelationId:
          $ref: '#/components/schemas/Uuid'
    EventAck:
      type: object
      additionalProperties: false
      required: [EventId, Status, ReasonCode]
      allOf:
        - if:
            properties:
              Status:
                const: ACCEPTED
          then:
            properties:
              ReasonCode:
                const: RECORDED
        - if:
            properties:
              Status:
                const: DUPLICATE
          then:
            properties:
              ReasonCode:
                const: ALREADY_RECORDED
        - if:
            properties:
              Status:
                const: CONFLICT
          then:
            properties:
              ReasonCode:
                const: EVENT_PAYLOAD_CONFLICT
        - if:
            properties:
              Status:
                const: REJECTED
          then:
            properties:
              ReasonCode:
                const: INVALID_EVENT
        - if:
            properties:
              Status:
                const: NEEDS_REVIEW
          then:
            properties:
              ReasonCode:
                enum: [UNKNOWN_CONFIGURATION_VERSION, MULTI_KIOSK_POLICY_REVIEW, RELATED_EVENT_PENDING]
      properties:
        EventId:
          $ref: '#/components/schemas/Uuid'
        Status:
          type: string
          enum: [ACCEPTED, DUPLICATE, CONFLICT, REJECTED, NEEDS_REVIEW]
        ReasonCode:
          type: string
          enum: [RECORDED, ALREADY_RECORDED, EVENT_PAYLOAD_CONFLICT, INVALID_EVENT, UNKNOWN_CONFIGURATION_VERSION, MULTI_KIOSK_POLICY_REVIEW, RELATED_EVENT_PENDING]
      description: |
        ACCEPTED/RECORDED y DUPLICATE/ALREADY_RECORDED confirman incorporación.
        CONFLICT/EVENT_PAYLOAD_CONFLICT conserva ambas evidencias para revisión.
        REJECTED/INVALID_EVENT informa un problema técnico que impide incorporar.
        NEEDS_REVIEW usa UNKNOWN_CONFIGURATION_VERSION, MULTI_KIOSK_POLICY_REVIEW
        o RELATED_EVENT_PENDING y retiene el hecho. DUPLICATE exige proyección
        ya completada; una mera recepción pendiente conserva NEEDS_REVIEW.
        La igualdad de BusinessDate entre consumo y cargas se valida por aplicación;
        una diferencia usa REJECTED/INVALID_EVENT antes de proyectar y conserva
        evidencia. El cliente mantiene el hecho pendiente de corrección.
        Ninguno revoca consumo local.
    ProblemDetails:
      type: object
      additionalProperties: false
      description: |
        Formato RFC 9457. type, title, status y detail conservan sus nombres
        estándar; code y correlationId siguen esa misma convención dentro de este
        objeto. Los objetos del dominio usan PascalCase.
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          enum: [INVALID_REQUEST, IDEMPOTENCY_KEY_MISMATCH, EQUIPMENT_AUTH_REQUIRED, EQUIPMENT_FORBIDDEN, BATCH_PAYLOAD_CONFLICT, CONTRACT_VERSION_CONFLICT, INVALID_BATCH, BATCH_NOT_FOUND, CONFIGURATION_NOT_PUBLISHED, BATCH_WINDOW_EXPIRED, RATE_LIMITED, SERVICE_UNAVAILABLE]
        correlationId:
          $ref: '#/components/schemas/Uuid'
        detail:
          type: string
          maxLength: 500
          description: Mensaje seguro sin tokens, biometría, credenciales ni excepción interna.
  examples:
    SyncBatch:
      summary: Lote sintético de un consumo confirmado localmente.
      value:
        BatchId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
        SchemaVersion: 1
        CreatedAtUtc: '2026-09-29T15:10:00Z'
        Events:
          - EventId: 88888888-8888-4888-8888-888888888888
            EventType: CONSUMPTION_RECORDED
            PayloadVersion: 1
            IntentId: 11111111-1111-4111-8111-111111111111
            DecisionId: 55555555-5555-4555-8555-555555555555
            ConsumptionId: 66666666-6666-4666-8666-666666666666
            TicketId: 77777777-7777-4777-8777-777777777777
            PersonId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
            MenuItemId: 44444444-4444-4444-8444-444444444444
            MenuVersion: 1
            Quantity: 1
            BusinessDate: '2026-09-29'
            AppliedQuotaCharges:
              - QuotaScopeId: cccccccc-cccc-4ccc-8ccc-cccccccccccc
                QuotaBucketId: dddddddd-dddd-4ddd-8ddd-dddddddddddd
                Units: 1
                BusinessDate: '2026-09-29'
            LocalCommittedAtUtc: '2026-09-29T15:00:02Z'
            ClientSequence: 1
            ConfigurationVersion: 1
            CatalogVersion: 1
            PolicyVersion: 1
            PriceSnapshot:
              Currency: ARS
              Scale: 2
              EmployeeChargeMinor: 150000
    DeniedCredentialRevokedBatch:
      summary: Denegación local sintética por CREDENTIAL_REVOKED; sin consumo ni ticket.
      value:
        BatchId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1
        SchemaVersion: 1
        CreatedAtUtc: '2026-09-29T14:00:01Z'
        Events:
          - EventId: 88888888-8888-4888-8888-000000000001
            EventType: CONSUMPTION_DENIED
            PayloadVersion: 1
            IntentId: 11111111-1111-4111-8111-000000000001
            DecisionId: 55555555-5555-4555-8555-000000000001
            ReasonCode: CREDENTIAL_REVOKED
            LocalCommittedAtUtc: '2026-09-29T14:00:00Z'
            ConfigurationVersion: 1
    DeniedCredentialExpiredBatch:
      summary: Denegación local sintética por CREDENTIAL_EXPIRED; sin consumo ni ticket.
      value:
        BatchId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa2
        SchemaVersion: 1
        CreatedAtUtc: '2026-09-29T14:00:01Z'
        Events:
          - EventId: 88888888-8888-4888-8888-000000000002
            EventType: CONSUMPTION_DENIED
            PayloadVersion: 1
            IntentId: 11111111-1111-4111-8111-000000000002
            DecisionId: 55555555-5555-4555-8555-000000000002
            ReasonCode: CREDENTIAL_EXPIRED
            LocalCommittedAtUtc: '2026-09-29T14:00:00Z'
            ConfigurationVersion: 1
    DeniedRuleDeniedBatch:
      summary: Denegación local sintética por RULE_DENIED; sin consumo ni ticket.
      value:
        BatchId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa3
        SchemaVersion: 1
        CreatedAtUtc: '2026-09-29T14:00:01Z'
        Events:
          - EventId: 88888888-8888-4888-8888-000000000003
            EventType: CONSUMPTION_DENIED
            PayloadVersion: 1
            IntentId: 11111111-1111-4111-8111-000000000003
            DecisionId: 55555555-5555-4555-8555-000000000003
            ReasonCode: RULE_DENIED
            LocalCommittedAtUtc: '2026-09-29T14:00:00Z'
            ConfigurationVersion: 1
    CompletedAck:
      summary: Recepción central del hecho, posterior a su autorización e impresión local.
      value:
        BatchId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
        Status: COMPLETED
        ServerAcknowledgedAtUtc: '2026-09-29T15:10:03Z'
        Results:
          - EventId: 88888888-8888-4888-8888-888888888888
            Status: ACCEPTED
            ReasonCode: RECORDED
        CorrelationId: 99999999-9999-4999-8999-999999999991
    PendingAck:
      value:
        BatchId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
        Status: PENDING
        CorrelationId: 99999999-9999-4999-8999-999999999992
  responses:
    Pending:
      description: Lote recibido en procesamiento central; el cliente conserva los eventos locales.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PendingBatchAck'
          examples:
            pending:
              $ref: '#/components/examples/PendingAck'
    BadRequest:
      description: 400 INVALID_REQUEST o IDEMPOTENCY_KEY_MISMATCH. Error del intercambio, sin efecto sobre operación local.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: 401 EQUIPMENT_AUTH_REQUIRED. Recuperar credencial de comunicación; nuevas confirmaciones siguen la política local de D-A02, conservando hechos previos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: 403 EQUIPMENT_FORBIDDEN. Comunicación no habilitada; no es una decisión de derecho a comedor.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: |
        409 BATCH_PAYLOAD_CONFLICT, CONTRACT_VERSION_CONFLICT o BATCH_WINDOW_EXPIRED.
        Se conserva lote/eventos locales y se expone el conflicto. No se cambia
        BatchId para ocultarlo. Las claves archivadas no se reciclan; una ventana
        técnica vencida requiere recuperación o conciliación sin perder hechos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.incomedor.example/problems/batch-payload-conflict
            title: El lote ya existe con otro contenido
            status: 409
            code: BATCH_PAYLOAD_CONFLICT
            correlationId: 99999999-9999-4999-8999-999999999993
    Unprocessable:
      description: 422 INVALID_BATCH. Lote inválido; conservar evidencia local y corregir el contrato sin borrar consumos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ConfigurationNotPublished:
      description: 404 CONFIGURATION_NOT_PUBLISHED. Todavía no hay publicación para el equipo autenticado. Un puesto provisionado conserva su snapshot activo; uno nuevo mantiene deshabilitadas las confirmaciones hasta recibir una provisión válida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.incomedor.example/problems/configuration-not-published
            title: No hay configuración publicada para el puesto
            status: 404
            code: CONFIGURATION_NOT_PUBLISHED
            correlationId: 99999999-9999-4999-8999-999999999994
    NotFound:
      description: 404 BATCH_NOT_FOUND en el ámbito del equipo; no revela un lote ajeno.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Throttled:
      description: 429 RATE_LIMITED. Respetar Retry-After y conservar el lote; D-A02 gobierna nuevas confirmaciones si el detector declara degradación.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unavailable:
      description: 503 SERVICE_UNAVAILABLE. Reintentar conservando hechos; monopuesto y CONTINUE_LOCAL atienden, el perfil de suspensión aplica D-A02.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
