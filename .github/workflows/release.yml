name: Release

# Sólo un tag de versión arma el paquete; ningún push a una rama lo hace (D8 de demostrar-flujo-de-punta-a-punta).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Las acciones van fijadas por SHA, con su versión al lado: una etiqueta como @v7 puede moverse (OWASP A08).
jobs:
  # Compila, prueba y arma el zip con permiso de sólo lectura: el código del repo y de NuGet nunca corre con escritura.
  paquete:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Sin credenciales guardadas en el clon: nadie empuja desde acá.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # El SDK sale de global.json, como en ci.yml.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore INComedor.sln

      # El mismo script que corre en local: compila, publica, corre el E2E contra el EXE publicado y sólo entonces
      # escribe el zip y su suma. Si falla, el job borrador no corre y no queda Release. El tag entra por el entorno,
      # nunca interpolado en el script (OWASP A03), y el script lo valida.
      - name: Paquete probado
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: ./.github/scripts/publicar-puesto.ps1 -Version $env:VERSION

      # Después del paquete y no antes, como en ci.yml, donde nada restaura después de la auditoría: en windows-latest,
      # un restore posterior a ella falló con MSB4181 (corridas 41132357042 y 41139494001). Un paquete vulnerable sigue
      # cortando el job antes de subir el zip, así que no hay borrador.
      - name: Dependencias vulnerables
        shell: pwsh
        run: ./.github/scripts/auditar-dependencias.ps1

      # Sólo si el job falla: los binlog del script, para ver la causa. Sin datos del repo ni secretos en el entorno.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: diagnostico
          path: artifacts/*.binlog
          if-no-files-found: ignore
          retention-days: 3

      # Sólo el zip y su suma pasan al job siguiente; la carpeta publicada no.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paquete
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
          if-no-files-found: error
          retention-days: 1

  # La escritura es sólo para crear el borrador del Release, y sólo en este job, que no corre código del repo.
  borrador:
    needs: paquete
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paquete
          path: artifacts

      # El zip que llega es el que probó el E2E: la suma del job paquete tiene que coincidir.
      - name: Suma del zip
        working-directory: artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: sha256sum --check "INComedor-Puesto-$VERSION-win-x64.zip.sha256"

      # Un borrador: publicarlo, y sumarle el video, es de David. Sin clon, gh toma el repo de GH_REPO.
      - name: Release en borrador
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          zip="artifacts/INComedor-Puesto-$VERSION-win-x64.zip"
          gh release create "$VERSION" "$zip" "$zip.sha256" --draft --verify-tag --title "INComedor $VERSION" --notes "Puesto autocontenido para Windows x64. El E2E del flujo principal pasó contra este EXE antes de armar el zip; la suma SHA-256 va al lado."
